<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">	DQX | 職人計算機 | さいほう・木工職人などの数値計算と素材計算｜ちけの便利ツール</title>
	<!-- ページ専用CSSを追加 -->
	<th:block layout:fragment="head-extra"></th:block>
</head>
	<section layout:fragment="content">
	<div class="container-lg d-flex flex-column	flex-grow-1">

		<!-- 更新履歴（直近3件） -->
		<div class="mt-2 mb-3" th:if="${recentUpdates != null and !recentUpdates.isEmpty()}">
			<div class="d-flex justify-content-between align-items-center">
				<h2 class="h6 mb-2">更新情報</h2>
				<a th:href="@{/updates}" class="small text-decoration-none">
					<button class="btn btn-outline-secondary mb-4">
						更新履歴一覧 &raquo;
					</button>
				</a>
			</div>
			<ul class="list-unstyled small mb-0">
				<li th:each="u : ${recentUpdates}" class="mb-1">
					<span class="badge bg-secondary" th:text="${u.category}">カテゴリ</span>
					<span th:text="${u.date}">日付</span>
					<span th:text="${u.content}">内容</span>
				</li>
			</ul>
		</div>

		<div class="row">

			<!-- 左カラム：検索＋ボタン＋選択済み作成物 -->
			<div class="left-column col-12 col-md-4 d-flex flex-column">
				<!-- 検索窓 -->
				<div class="position-relative">
					<input type="text" id="itemInput" class="form-control" placeholder="作成物を入力...">
					<div id="suggestions" class="list-group position-absolute w-100"></div>
				</div>

				<!-- 計算・リセットボタン -->
				<div>
					<button id="calculateBtn" class="btn w-100">計算</button>
					<button id="resetBtn" class="btn btn-secondary w-100">リセット</button>
					<button id="craftBtn" class="btn w-100">クラフト</button>
				</div>

				<!-- 選択済み作成物カード -->
				<div class="card flex-grow-1 overflow-auto" id="itemsCard">
					<h3>選択済み作成物一覧</h3>
					<div id="itemsList"></div>
				</div>

				<!-- 計算結果 -->
				<div class="card flex-grow-1 overflow-auto" id="resultContainer">
					<h3>必要素材一覧</h3>
					<div id="requiredMaterialList"></div>
				</div>
			</div>

			<!-- 右カラム：職人作成物一覧 -->
			<div class="right-column col-12 col-md-8 d-flex flex-column">
				<!-- 職人タブ -->
				<div id="jobTabs" class="d-flex flex-wrap justify-content-start"></div>

				<!-- 職人作成物カード -->
				<div class="card flex-grow-1 overflow-auto" id="jobItemsCard">
					<div id="jobItems" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4"></div>
				</div>
			</div>
		</div>
	</div>
	</section>
</html>
